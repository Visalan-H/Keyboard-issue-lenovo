name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/DeadKeys
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=${GITHUB_REF_NAME}" -o dist/DeadKeys/deadkeys.exe .
          cp config.json README.md DOCS.md LICENSE dist/DeadKeys/
          cd dist
          zip -r "DeadKeys-${GITHUB_REF_NAME}-windows-amd64.zip" DeadKeys
          cp DeadKeys/deadkeys.exe .
          sha256sum deadkeys.exe *.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "DeadKeys $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.zip dist/deadkeys.exe dist/SHA256SUMS.txt
